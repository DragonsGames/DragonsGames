name: Profile activity animation

on:
  schedule:
    - cron: "20 0 * * *"
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/koi.yml
      - .github/scripts/languages.py

permissions:
  contents: write

concurrency:
  group: profile-animation
  cancel-in-progress: true

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: yalongwastaken/git-koi@v1.0.2
        with:
          body: white
          output-dir: koi
      - name: Generate language chart
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/languages.py
      - name: Commit profile assets if they changed
        shell: bash
        run: |
          git add koi/koi.gif koi/languages.svg
          if git diff --cached --quiet; then
            echo "Profile assets are unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet --message "profile: update activity visuals"
          git pull --rebase --autostash origin main
          git push --quiet